<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analyzer History - Requirement Ambiguity Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="analyzer-page">
    <aside class="left-panel glass-card">
      <div class="profile-box">
        <div class="profile-avatar">
          {{ user.name[0] if user and user.name else 'U' }}
        </div>
        <div>
          <h3 id="profileName">{{ user.name }}</h3>
          <p id="profileEmail">{{ user.email }}</p>
        </div>
      </div>

      <hr class="line" />

      <h2>My Pages</h2>

      <button type="button" class="btn primary-btn full-btn" onclick="toggleTheme()">
        Toggle Theme
      </button>

      <br /><br />
      <a href="/analyzer" class="btn primary-btn full-btn">Go to Analyzer</a>

      <br /><br />
      <a href="/dashboard" class="btn primary-btn full-btn">Dashboard Page</a>

      <br /><br />
      <a href="/history-page" class="btn primary-btn full-btn">Analyzer History</a>

      <br /><br />
      <a href="/logout" class="btn secondary-btn full-btn">Logout</a>
    </aside>

    <main class="right-panel glass-card">
      <h1>Analyzer History</h1>
      <p class="subtitle">Saved history for your profile</p>

      <div id="historyContainer" class="result-box">
        Loading your history...
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
