<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Requirement Ambiguity Analyzer</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dark-theme">
    <div class="analyzer-page">
        <aside class="left-panel">
            <div class="profile-box">
                <div class="profile-avatar">U</div>
                <div>
                    <h3 id="profileName">User</h3>
                    <p id="profileEmail">user@email.com</p>
                </div>
            </div>

            <hr class="line" />

            <h2>Dashboard</h2>

            <div class="dashboard-list">
                <div class="dashboard-item">
                    <span>Total Requirements</span>
                    <strong id="totalRequirements">0</strong>
                </div>

                <div class="dashboard-item">
                    <span>Ambiguous Count</span>
                    <strong id="ambiguousCount">0</strong>
                </div>

                <div class="dashboard-item">
                    <span>Average Score</span>
                    <strong id="averageScore">0</strong>
                </div>

                <div class="dashboard-item">
                    <span>Last Predicted Label</span>
                    <strong id="lastLabel">None</strong>
                </div>
            </div>

            <div class="top-actions">
                <button class="btn primary-btn full-btn" onclick="loadDashboard()">Refresh Dashboard</button>
                <a href="/logout" class="btn secondary-btn full-btn">Logout</a>
            </div>
        </aside>

        <main class="right-panel">
            <h1>Requirement Analyzer</h1>
            <p class="subtitle">Enter any sentence or paragraph and analyze it using AI</p>

            <textarea
                id="requirementText"
                placeholder="Enter your requirement text here..."
            ></textarea>

            <label for="fileInput">Upload File:</label>
            <input id="fileInput" type="file" accept=".txt,.docx,.pdf" />

            <div class="top-actions">
                <button class="btn primary-btn" onclick="analyzeRequirement()">Analyze Requirement</button>
                <button class="btn secondary-btn" onclick="analyzeUploadedFile()">Analyze File</button>
            </div>

            <div class="analysis-section">
                <h3>Highlighted Text</h3>
                <div id="highlightedOutput" class="result-box result-html-box"></div>
            </div>

            <div class="analysis-section">
                <h3>Corrected Sentence</h3>
                <div id="correctedOutput" class="result-box"></div>
            </div>

            <div class="analysis-section">
                <h3>Professional Rewrite</h3>
                <div id="rewriteOutput" class="result-box"></div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
