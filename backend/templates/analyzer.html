<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analyzer - Requirement Ambiguity Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="analyzer-page">
    <aside class="left-panel glass-card">
      <div class="profile-box">
        <div class="profile-avatar">
          {{ user.name[0] if user and user.name else 'U' }}
        </div>
        <div>
          <h3 id="profileName">{{ user.name }}</h3>
          <p id="profileEmail">{{ user.email }}</p>
        </div>
      </div>

      <hr class="line" />

      <h2>Dashboard</h2>

      <div class="dashboard-list">
        <div class="dashboard-item">
          <span>Total Requirements</span>
          <strong id="totalRequirements">0</strong>
        </div>

        <div class="dashboard-item">
          <span>Ambiguous Count</span>
          <strong id="ambiguousCount">0</strong>
        </div>

        <div class="dashboard-item">
          <span>Average Score</span>
          <strong id="averageScore">0</strong>
        </div>

        <div class="dashboard-item">
          <span>Last Predicted Label</span>
          <strong id="lastLabel">None</strong>
        </div>
      </div>

      <button type="button" class="btn primary-btn full-btn" onclick="loadDashboard()">
        Refresh Dashboard
      </button>

      <br /><br />
      <a href="/logout" class="btn secondary-btn full-btn">Logout</a>
    </aside>

    <main class="right-panel glass-card">
      <h1>Requirement Analyzer</h1>
      <p class="subtitle">Enter any software requirement text and analyze it using AI</p>

      <textarea id="requirementText" placeholder="Enter requirement here..."></textarea>

      <div class="top-actions">
        <button type="button" class="btn primary-btn" onclick="analyzeRequirement()">
          Analyze Requirement
        </button>
      </div>

      <div id="analysisResult" class="result-box"></div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
