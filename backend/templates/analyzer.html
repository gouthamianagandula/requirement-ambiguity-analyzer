<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Requirement Ambiguity Analyzer</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-body">
    <div class="dashboard-shell">
        <aside class="sidebar">
            <div class="brand-block">
                <div class="brand-logo">RAA</div>
                <div>
                    <h2>Requirement Ambiguity Analyzer</h2>
                    <p>Analyze and rewrite requirements</p>
                </div>
            </div>

            <nav class="side-nav">
                <a href="/analyzer" class="active">Analyzer</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/history-page">History</a>
                <a href="/admin">Admin</a>
                <a href="/logout">Logout</a>
            </nav>
        </aside>

        <main class="main-panel">
            <header class="topbar glass">
                <div>
                    <h1>Requirement Analyzer</h1>
                    <p>Highlight wrong words, correct the sentence, and provide a better rewrite.</p>
                </div>
            </header>

            <section class="panel glass input-panel">
                <textarea
                    id="requirementText"
                    placeholder="Example: the system should quickly process the file and it should notify user soon"
                ></textarea>

                <label for="fileInput">Upload File:</label>
                <input id="fileInput" type="file" accept=".txt,.docx,.pdf" title="Upload a text, Word, or PDF file" />

                <div class="top-actions">
                    <button class="primary-btn" onclick="analyzeRequirement()">Analyze Text</button>
                    <button class="secondary-btn" onclick="analyzeUploadedFile()">Analyze File</button>
                </div>
            </section>

            <!-- RESULTS -->

            <section class="panel glass result-card">
                <h3>Highlighted Wrong Words</h3>
                <div id="highlightedOutput" class="result-box"></div>
            </section>

            <section class="panel glass result-card">
                <h3>Corrected Sentence</h3>
                <div id="correctedOutput" class="result-box"></div>
            </section>

            <section class="panel glass result-card">
                <h3>Professional Rewrite</h3>
                <div id="rewriteOutput" class="result-box"></div>
            </section>

        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
