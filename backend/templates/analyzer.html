<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAA Analyzer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="dark-theme">

<div class="analyzer-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="brand-card">
                <div class="brand-logo">RAA</div>
                <div>
                    <h2>RAA Analyzer</h2>
                    <p>AI Requirement Analyzer</p>
                </div>
            </div>

            <div class="profile-card">
                <div class="profile-avatar">U</div>
                <div class="profile-info">
                    <h3 id="profileName">User</h3>
                    <p id="profileEmail">email</p>
                </div>
            </div>

        </div>

        <!-- DASHBOARD -->
        <div class="sidebar-section">
            <h4>Dashboard</h4>

            <div class="dashboard-grid">
                <div class="dashboard-item">
                    <span>Total</span>
                    <strong id="totalRequirements">0</strong>
                </div>

                <div class="dashboard-item">
                    <span>Ambiguous</span>
                    <strong id="ambiguousCount">0</strong>
                </div>

                <div class="dashboard-item">
                    <span>Avg Score</span>
                    <strong id="averageScore">0</strong>
                </div>

                <div class="dashboard-item">
                    <span>Last Label</span>
                    <strong id="lastLabel">None</strong>
                </div>
            </div>
        </div>

        <div class="sidebar-actions">
            <a href="/history-page" class="nav-btn">History</a>
            <a href="/dashboard" class="nav-btn">Dashboard</a>
            <a href="/logout" class="nav-btn logout-btn">Logout</a>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="hero-panel">
            <h1>Requirement Analyzer</h1>
            <p>Analyze ambiguity, clarity, and improve professional writing.</p>
        </div>

        <!-- INPUT -->
        <div class="editor-panel">
            <label class="field-label">Enter Requirement</label>

            <textarea id="requirementText" placeholder="Enter requirement..."></textarea>

            <div class="action-row">
                <button class="primary-btn analyze-btn" onclick="analyzeRequirement()">Analyze Requirement</button>
                <button class="secondary-btn" onclick="analyzeUploadedFile()">Analyze File</button>

                <!-- PREMIUM -->
                <button class="secondary-btn" onclick="copyResult()">Copy</button>
                <button class="secondary-btn" onclick="downloadReport()">Download</button>
            </div>

            <label for="fileInput">Upload File</label>
            <input type="file" id="fileInput" aria-label="Upload requirement file">
        </div>

        <!-- STATUS -->
        <div id="analyzerStatus" class="status-box"></div>

        <!-- OUTPUT -->
        <div class="result-panel">
            <h3>Highlighted Text</h3>
            <div id="highlightedOutput" class="result-box"></div>
        </div>

        <div class="result-panel">
            <h3>Corrected Text</h3>
            <div id="correctedOutput" class="result-box"></div>
        </div>

        <div class="result-panel">
            <h3>Professional Rewrite</h3>
            <div id="rewriteOutput" class="result-box"></div>
        </div>

        <div class="result-panel">
            <h3>Issues</h3>
            <div id="issuesOutput"></div>
        </div>

    </main>

</div>

<script src="/static/app.js"></script>

</body>
</html>
