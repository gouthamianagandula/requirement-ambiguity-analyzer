<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Requirement Ambiguity Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page-container">
    <div class="main-card">
      <h1>Dashboard</h1>
      <p class="subtitle">View analysis summary</p>

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Total Requirements Analyzed</h3>
          <p id="totalRequirements">0</p>
        </div>

        <div class="dashboard-card">
          <h3>Ambiguous Count</h3>
          <p id="ambiguousCount">0</p>
        </div>

        <div class="dashboard-card">
          <h3>Average Score</h3>
          <p id="averageScore">0</p>
        </div>

        <div class="dashboard-card">
          <h3>Last Predicted Label</h3>
          <p id="lastLabel">None</p>
        </div>
      </div>

      <button type="button" class="btn primary-btn" onclick="loadDashboard()">
        Refresh Dashboard
      </button>

      <br />
      <br />

      <a href="/" class="link">Home</a> |
      <a href="/login" class="link">Login</a> |
      <a href="/analyzer" class="link">Analyzer</a>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
